<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" role="img" aria-label="Victor logo">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Syne:wght@800&amp;display=swap');</style>

    <!-- Icon gradient (diagonal) -->
    <linearGradient id="grad-icon" x1="0" y1="0" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>

    <!-- Text gradient (horizontal) -->
    <linearGradient id="grad-text" x1="82" y1="0" x2="320" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>

    <!-- Glow filter for V stroke -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Page background (dark, for standalone viewing) -->
  <rect width="320" height="80" rx="16" fill="#080810"/>

  <!-- ── ICON MARK ── -->
  <!-- Outer glow ring -->
  <rect x="8" y="8" width="64" height="64" rx="18" fill="#818cf8" fill-opacity="0.07"/>

  <!-- Badge background -->
  <rect x="10" y="10" width="60" height="60" rx="16"
        fill="url(#grad-icon)" fill-opacity="0.14"/>

  <!-- Badge border -->
  <rect x="10" y="10" width="60" height="60" rx="16"
        fill="none" stroke="url(#grad-icon)" stroke-width="1.5" opacity="0.55"/>

  <!-- V stroke (glow layer) -->
  <path d="M21 22 L40 56 L59 22"
        fill="none" stroke="url(#grad-icon)" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round"
        filter="url(#glow)" opacity="0.6"/>

  <!-- V stroke (crisp layer) -->
  <path d="M21 22 L40 56 L59 22"
        fill="none" stroke="url(#grad-icon)" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ── WORDMARK ── -->
  <text x="84" y="51"
        font-family="Syne, 'Segoe UI', system-ui, sans-serif"
        font-weight="800"
        font-size="34"
        letter-spacing="-0.8"
        fill="url(#grad-text)">Victor</text>

  <!-- Dot accent after name -->
  <circle cx="305" cy="50" r="4" fill="#22d3ee" opacity="0.8"/>
</svg>
